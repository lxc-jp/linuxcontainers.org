      stgraber@vorash:~$ incus network list-allocations --summary
      +----------+--------------------------+-------------------------------------------------------------------------------------------------------------------------------------------------------------------+
      | NETWORK  |          SUBNET          |                                                                               USED                                                                                |
      +----------+--------------------------+-------------------------------------------------------------------------------------------------------------------------------------------------------------------+
