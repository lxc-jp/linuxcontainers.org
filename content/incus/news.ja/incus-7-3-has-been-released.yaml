title: Incus 7.3 has been released
date: 2026/07/31 18:07
origin: https://discuss.linuxcontainers.org/t/incus-7-3-has-been-released/27033
content: |-
  <!--
  The Incus team is pleased to announce the release of Incus 7.3!
  -->
  Incus チームは、Incus 7.3 のリリースのアナウンスができてうれしいです!

  <!--
  Another busy release for us, both on the feature front with quite a lot of exciting new features as well as on the performance, bugfix and securty front.
  -->
  いつもと同様に充実した内容のリリースです。多数の魅力的な新機能が追加され、パフォーマンスの向上、バグフィックス、セキュリティ強化の面でも多くの改善が図られています。

  [![image|690x308](https://discuss.linuxcontainers.org/uploads/default/original/2X/e/e1437e2bc8aaad2a865ff8ed9ff463991d41b1ed.png)](https://linuxcontainers.org/incus/try-it/)

  <!--
  As usual, you can try Incus for yourself online: [Linux Containers - Incus - Try it online](https://linuxcontainers.org/incus/try-it/)
  -->
  いつものように、オンラインでご自身で試せます: [Linux Containers - Incus - オンラインでの試用](https://linuxcontainers.org/incus/try-it/)

  # セキュリティ修正 <!-- Security fixes -->

  <!--
  This release fixes 13 security issues:
  -->
  このリリースでは、13 の脆弱性を修正しました:

  - [CVE-2026-62867](https://github.com/lxc/incus/security/advisories/GHSA-q7xw-r4w2-2wcm) (critical) - ストレージボリュームの `block.create_options` を経由した引数インジェクション <!-- Argument injection through storage volume `block.create_options` -->
  - [CVE-2026-62940](https://github.com/lxc/incus/security/advisories/GHSA-qw5c-v953-38gw) (critical) - インスタンスの移行設定の上書きによるプロジェクト制限のバイパス <!-- Project restriction bypass via instance migration config override -->
  - [CVE-2026-62941](https://github.com/lxc/incus/security/advisories/GHSA-mq9x-prm8-3vpw) (critical) - プロジェクト間のインスタンスコピーを介したのプロジェクト制限のバイパス <!-- Project restriction bypass via cross-project instance copy -->
  - [CVE-2026-63125](https://github.com/lxc/incus/security/advisories/GHSA-6rqx-22hc-qm36) (critical) - 細工されたイメージ内の `backup.yaml` を介したホスト上の任意のファイルへの書き込み <!-- Arbitrary file write on host via `backup.yaml` symlink in crafted image -->
  - [CVE-2026-63343](https://github.com/lxc/incus/security/advisories/GHSA-fmjx-5j3g-997p) (critical) - 細工されたイメージ内の `metadata.yaml` を介したホスト上の任意のファイルの読み書き <!-- Arbitrary file read+write on host via `metadata.yaml` symlink in crafted image -->
  - [GHSA-26gp-p5fw-3r2h](https://github.com/lxc/incus/security/advisories/GHSA-26gp-p5fw-3r2h) (critical) - インスタンスバックアップのインポートにおけるパストラバーサルによるホスト上の任意のファイルへの書き込み <!-- Arbitrary file write on host via path traversal in instance backup import -->
  - [GHSA-67qw-68v3-36h6](https://github.com/lxc/incus/security/advisories/GHSA-67qw-68v3-36h6) (critical) - カスタムボリュームのインポートにおけるパストラバーサルによるホスト上の任意のファイルへの書き込み <!-- Arbitrary file write on host via path traversal in custom volume import -->
  - [GHSA-7fj9-65v4-rp7h](https://github.com/lxc/incus/security/advisories/GHSA-7fj9-65v4-rp7h) (critical) - 画像埋め込みのシンボリックリンクと `oci.dns.*` における改行インジェクションによるホスト上の任意のファイルへの書き込み <!-- Arbitrary file write on host via image-planted symlinks and `oci.dns.*` newline injection -->
  - [GHSA-p2v3-6wvc-cv3p](https://github.com/lxc/incus/security/advisories/GHSA-p2v3-6wvc-cv3p) (critical) - イメージフィンガープリントのパストラバーサルによるホスト上の任意のファイルへの書き込み <!-- Arbitrary file write on host via image fingerprint path traversal -->
  - [GHSA-4qxq-p5hm-3q3p](https://github.com/lxc/incus/security/advisories/GHSA-4qxq-p5hm-3q3p) (high) - VM テンプレートのパストラバーサルによるホスト上の任意のファイルの読み書き <!-- Arbitrary file read+write on host via VM template path traversal -->
  - [GHSA-m3j6-p3v3-qmjv](https://github.com/lxc/incus/security/advisories/GHSA-m3j6-p3v3-qmjv) (high) - `nvidia.driver.capabilities` を介したコンテナ設定にたいする改行インジェクション <!-- Container configuration newline injection through `nvidia.driver.capabilities` -->
  - [CVE-2026-62313](https://github.com/lxc/incus/security/advisories/GHSA-53cg-qvg7-m8vg) (medium) - `security.idmap.isolated` を省略することによるプロジェクト隔離制限のバイパス <!-- Project isolation restriction bypass by omitting `security.idmap.isolated` -->
  - [GHSA-6v6x-387m-rj4w](https://github.com/lxc/incus/security/advisories/GHSA-6v6x-387m-rj4w) (medium) - ネットワークアドレスセットのプロジェクト制限のバイパス <!-- Project restriction bypass on network address sets -->

  <!--
  Note that some of the above don't yet have CVE assigned. This is due to Github having a 3-4 weeks backlog on CVE assignments right now. We have requested CVEs for all the issues above and they will be automatically added to the relevant GHSA once allocated.
  -->
  上記の中にはまだ CVE が割り当てられていないものがあることに注意してください。これは現在、GitHub で CVE 割り当てに 3-4 週間の遅延が発生しているためです。上記のすべてに CVE をリクエストしており、割り当てられ次第、関連する GHSA に自動的に追加されます。

  # 新機能 <!-- New features -->
  ## DRM ネイティブコンテキストによる仮想マシン向けの GPU 共有 <!-- GPU sharing for virtual machines through DRM native context -->
  <!--
  A new `native-context` GPU type is now available for virtual machines.
  -->
  新たに `native-context` タイプの GPU が仮想マシンで利用できるようになりました。

  <!--
  This makes use of `virglrenderer` and the `virtio-gpu` type to provide GPU 3D acceleration.
  -->
  この機能は、`virglrenderer` と `virtio-gpu` タイプを使い、GPU 3D アクセラレーション処理を提供します。

  <!--
  Unlike full GPU passthrough, this can be used by multiple virtual machines in parallel.
  Currently, only Linux appears to have drivers fully supporting this, so Windows guests remain unaccelerated.
  -->
  フル GPU パススルーと異なり、これは複数の仮想マシンで並列して使えます。
  現時点では、Linux のみがこれを完全にサポートするドライバーを提供しているようで、Windows ゲストはアクセラレーションの対象外です。

  <!--
  This can be enabled with:
  -->
  これは、次のように有効にできます:

      stgraber@vorash:~$ incus config device add v1 gpu0 gpu gputype=native-context

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/reference/devices_gpu/

  ## 仮想マシン向けの UEFI 変数管理 <!-- UEFI variable management for virtual machines -->
  <!--
  Incus now allows direct NVRAM interactions for virtual machines.
  -->
  Incus で、仮想マシンの NVRAM を直接の操作できるようになりました。

  <!--
  This is exposed through the CLI as `incus low-level nvram` and allows for both read and write access to the NVRAM.
  -->
  この機能は、CLI の `incus low-level nvram` コマンドを通して提供され、NVRAM の読み取りと書き込みが可能です。

  <!--
  Most UEFI NVRAM configuration keys can be parsed and updated, allowing for modification of the boot devices, boot order and more. Write operation require a stopped VM. A follow-up will focus specifically on UEFI Secure Boot key provisioning.
  -->
  UEFI NVRAM のほとんどの設定を読み取り、更新できるので、ブートデバイスの変更やブート順序が変更できます。書き込み操作は、VM が停止している必要があります。UEFI のセキュアブートのキープロビジョニングに特化した機能については、後日改めて対応する予定です。

  <!--
  Additionally, a new `rebuild-nvram` repair action was added to `incus low-level repair`, making it easy to reset a virtual machine's UEFI NVRAM to a clean state.
  -->
  さらに、`incus low-level repair` に新たに `rebuild-nvram` という修復アクションが追加されました。これにより、仮想マシンの UEFI NVRAM をクリーンな状態に簡単にリセットできるようになりました。

      stgraber@vorash:~$ incus launch images:debian/13 v1 --vm
      Launching v1
      stgraber@vorash:~$ incus low-level nvram get v1 Boot0000
      binary: CQEAACwAQgBvAG8AdABNAGEAbgBhAGcAZQByAE0AZQBuAHUAQQBwAHAAAAAEBxQAyb24fOv4NE+q6j7kr2UWoQQGFADcW8Lu8meVTbHV+BsgOdEdf/8EAA==
      data:
        active: true
        category: app
        description: BootManagerMenuApp
        force_reconnect: false
        hidden: true
        paths:
          - - Fv(7cb8bdc9-f8eb-4f34-aaea-3ee4af6516a1)/FvFile(eec25bdc-67f2-4d95-b1d5-f81b2039d11d)
      attributes:
        - NON_VOLATILE
        - BOOTSERVICE_ACCESS
        - RUNTIME_ACCESS

  ## インスタンスポートフォワーディング <!-- Instance port forwarding -->
  <!--
  A new `incus port-forward` command makes it easy to access a TCP service running inside of an instance.
  -->
  新たに追加された `incus port-forward` コマンドを使用すると、インスタンス内で実行されている TCP サービスに簡単にアクセスできます。

  <!--
  The CLI tool runs a local TCP listener and forwards every connection made to it to the given address and port inside of the instance or on a network attached to that instance.
  -->
  CLI ツールは、ローカル TCP リスナーを実行し、そのリスナーへの接続をすべて、インスタンス内部またはそのインスタンスに接続されたネットワーク上の指定されたアドレスとポートに転送します。

      stgraber@vorash:~$ incus port-forward my-nginx 80 8080
      stgraber@vorash:~$ incus port-forward my-nginx 10.0.3.1:443 0.0.0.0:8443

  ## 認証設定の再設計 <!-- Reworked authorization configuration -->
  <!--
  The authorization configuration has moved to a new `authorization.*` namespace, with the former `openfga.*` server configuration keys now being `authorization.openfga.api.url`, `authorization.openfga.api.token` and `authorization.openfga.store.id`. Existing values are automatically migrated on upgrade.
  -->
  認証設定は、新たに `authorization.*` ネームスペースに移動しました。これにともない、従来の `openfga.*` サーバー設定キーは、`authorization.openfga.api.url`、`authorization.openfga.api.token`、`authorization.openfga.store.id` に変更されました。既存の設定値は、アップグレード時に自動的に移行されます。

  <!--
  This now allows us to support multiple authorization drivers in parallel and chose the provider based on the request type. This is done through a new set of keys:
  -->
  これにより、複数の認証ドライバーを並行してサポートし、リクエストの種類によってプロバイダーを選択できるようになりました。これは、新しいキーのセットによって実現されます:

  - `authorization.client.default`: 具体的なクラスルートを持たないクライアント用ドライバー <!-- driver for clients without a more specific class route -->
  - `authorization.client.unix`: ローカル（`unix` ソケット）クライアント用ドライバー <!-- driver for local (`unix` socket) clients -->
  - `authorization.client.tls`: 制限なし TLS クライアント用ドライバー <!-- driver for unrestricted TLS clients -->
  - `authorization.client.tls-restricted`: （プロジェクトスコープの）制限付き TLS クライアント用ドライバー <!-- driver for restricted (project-scoped) TLS clients -->
  - `authorization.client.oidc`: OIDC 認証クライアント用ドライバー <!-- driver for OIDC-authenticated clients -->

  <!--
  Each key accepts one of `allow`, `deny`, `openfga` or `scriptlet`, with `tls` additionally available for restricted TLS clients.
  -->
  各キーは `allow`、`deny`、`openfga`、`scriptlet` のいずれかを受け付けます。さらに、制限付き TLS クライアント向けには `tls` も利用可能です。

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/authorization/

  ## `incus low-level` の導入 <!-- Introducing `incus low-level` -->
  <!--
  The `incus debug` command has been renamed to `incus low-level`.
  -->
  `incus debug` コマンドを `incus low-level` にリネームしました。

  <!--
  As part of that, it also gained a few new sub-commands:
  -->
  その一環で、いくつか新しいサブコマンドを追加しました:

   - `bitmap` （仮想マシン向けダーティービットマップ管理）<!-- (dirty bitmap management for VMs) -->
   - `nvram` （前述のとおり）<!-- (as mentioned above) -->
   - `repair` インスタンスの修復アクション <!-- (repair actions for instances) -->

  ## BGP unnumbered のサポート <!-- BGP unnumbered support -->
  <!--
  Incus now supports unnumbered BGP for its peering with external routers.
  -->
  Incus は、外部ルーターとのピアリングで Unnumbered BGP をサポートするようになりました。

  <!--
  This is done through a new `bgp.peers.NAME.interface` configuration key which is used as an alternative to `bgp.peers.NAME.address`.
  -->
  これは `bgp.peers.NAME.address` の代替として使用する新しい設定キー `bgp.peers.NAME.interface` によって実現されます。

  <!--
  When set, the BGP session is established over the given interface using BGP unnumbered. The peer's IPv6 link-local address is discovered automatically and IPv4 routes are exchanged using the extended next-hop capability.
  -->
  設定すると、指定したインターフェースで BGP unnumbered を使って BGP セッションが確立します。ピアの IPv6 リンクローカルアドレスは自動的に検出され、IPv4 ルートは拡張 next-hop 機能を使って交換されます。

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/howto/network_bgp/

  ## ネストした仮想化の制御 <!-- Control of nested virtualization -->
  <!--
  The `security.nesting` instance configuration key now also applies to virtual machines.
  -->
  `security.nesting` インスタンス設定キーは、仮想マシンにも適用されるようになりました。

  <!--
  Unlike containers, this defaults to `true` to retain our previous default behavior.
  When set to `false`, the `svm` and `vmx` CPU flags will get disabled for the guest VM.
  -->
  コンテナとは異なり、これはデフォルトで `true` で、従来のデフォルトの動作が維持されます。`false` に設定すると、ゲスト VM では `svm` と `vmx` CPU フラグが無効化されます。

  <!--
  A matching `restricted.virtual-machines.nesting` project configuration key was also added. When set to `block`, all virtual machines in the project must have `security.nesting` set to `false`.
  -->
  対応するプロジェクト構成キーである `restricted.virtual-machines.nesting` も追加されました。`block` に設定した場合、プロジェクト内のすべての仮想マシンの `security.nesting` は `false` に設定されている必要があります。

  ドキュメント<!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/reference/projects/

  ## すべてのリモートを対象としたインスタンスの一覧表示 <!-- Listing instances across all remotes -->
