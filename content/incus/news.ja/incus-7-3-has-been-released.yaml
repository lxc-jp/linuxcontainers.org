      +-------------------------+---------------------------------------------+----------+----------+-----+-------------------+
      | /1.0/instances/my-nginx | fd42:8b9f:58e4:b6ac:1266:6aff:fe61:8058/128 | incusbr0 | instance | YES | 10:66:6a:61:80:58 |
