  ## I/O 制限の改良 <!-- I/O limits improvements -->
  <!--
  `unix-block` devices now support the `limits.read` and `limits.write` configuration keys, behaving like their `disk` device equivalents and accepting either a byte/s value or an IOPS value.
  -->
  `unix-block` デバイスは、`limits.read` と `limits.write` 設定キーをサポートするようになりました。これにより、`disk` デバイスと同様に動作し、バイト/秒または IOPS 値を指定できるようになりました。

  <!--
  Additionally, it's now possible to set both a byte/s limit and an IOPS limit at the same time on `disk` and `unix-block` devices by using a comma separated list of values:
  -->
  さらに、カンマ区切りの値のリストを使うことで、`disk` と `unix-block` デバイスに対して同時にバイト/秒の制限と IOPS の制限を同時に設定できるようになりました:

      incus config device set my-vm data limits.read=30MiB,1000iops

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/reference/devices_unix_block/

  ## ストレージプールメトリクス <!-- Storage pool metrics -->
  <!--
  The `/1.0/metrics` endpoint now includes storage pool usage data:
  -->
  `/1.0/metrics` エンドポイントに、ストレージプールの使用状況データが含まれるようになりました:

  - `incus_storage_pool_size_bytes{pool="<pool>",driver="<driver>"}`
  - `incus_storage_pool_used_bytes{pool="<pool>",driver="<driver>"}`

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/metrics/

  ## ACME EAB（Extended Account Binding） <!-- ACME External Account Binding -->
  <!--
  The ACME integration now supports External Account Binding (EAB) through two new server configuration keys, `acme.eab.kid` and `acme.eab.hmac`.
  -->
  ACME 統合機能は、EAB（Extended Account Binding）をサポートするようになりました。これは `acme.eab.kid` と `acme.eab.hmac` という 2 つの新しいサーバー設定キーを通して設定します。

  <!--
  This allows using ACME providers which require pre-established account credentials.
  -->
  これにより、事前にアカウント認証情報が必要な ACME プロバイダーを利用できるようになりました。

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/authentication/

  ## リソース API における CPU クラスターのレポート <!-- CPU cluster reporting in the resources API -->
  <!--
  The resources API now reports a `cluster` field for each CPU core.
  This is useful in ARM big.LITTLE environments where core identifiers aren't unique per socket but instead per cluster of cores.
  -->
  リソース API は、各 CPU コアに対して `cluster` フィールドをレポートするようになりました。これは、コア識別子がソケットごとに一意ではなく、コアのクラスターごとに一意である ARM big.LITTLE 環境で役に立ちます。

  <!--
  This is visible in `incus info --resources` and is also used to make the VM CPU topology validation cluster-aware.
  -->
  これは、`incus info --resources` で表示され、VM の CPU トポロジー検証をクラスター対応にするためにも使用されます。

  ## ネイティブな Windows と macOS のインストーラー <!-- Native Windows and macOS installers -->
  <!--
  Incus releases now come with native installers for the client tool, an MSI package for Windows and a PKG for macOS, built and published as part of the release process.
  -->
  Incus は、クライアントツール用のネイティブなインストーラー、Windows は MSI パッケージ、macOS は PKG でリリースされるようになりました。これらはリリースプロセスの一環としてビルドされ、公開されます。

  <!--
  Worth noting that at this time neither of those are signed, so installation may be challenging.
  -->
  現時点では、これらのどちらにも署名がないため、インストールがチャレンジングになる可能性があります。

